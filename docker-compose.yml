services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insureai-backend
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      APP_PORT: 8000
      REDIS_URL: redis://redis:6379/0

    volumes:
      - ./data:/app/data
      - ./models:/app/models

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: insureai-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    image: node:18-alpine
    container_name: insureai-frontend
    restart: unless-stopped

    working_dir: /app

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data: