name: InsureAI CI

on:
  push:
    branches: [ main, master, final-hardening ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-audit:
    name: Backend Test Suite & Release Gate Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          # Pin exact Python minor version to match training environment.
          # Model was trained on Python 3.10.x; using any other version risks
          # joblib/scikit-learn serialization incompatibility.
          python-version: "3.10"
          cache: "pip"

      - name: Verify Python version matches training environment
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 10), f'Expected Python 3.10, got {sys.version_info[:2]}'"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify no dependency conflicts
        run: pip check

      - name: Verify runtime versions match model training environment
        run: |
          python -c "
          import sklearn, xgboost, shap, joblib
          assert sklearn.__version__ == '1.7.2', f'sklearn: expected 1.7.2, got {sklearn.__version__}'
          assert xgboost.__version__ == '3.2.0', f'xgboost: expected 3.2.0, got {xgboost.__version__}'
          assert shap.__version__ == '0.49.1', f'shap: expected 0.49.1, got {shap.__version__}'
          print(f'Runtime verified: sklearn={sklearn.__version__}, xgboost={xgboost.__version__}, shap={shap.__version__}')
          "

      - name: Generate final submission artifact
        run: python scripts/generate_submission.py

      - name: Run Full Pytest Suite (83+ Unit & Integration Tests)
        run: |
          pytest -v --tb=short

      - name: Run Production Release Audit & Verification Gates (16 Gates incl. Inference Smoke)
        run: |
          python scripts/release_check.py

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Frontend Artifact
        working-directory: ./frontend
        run: npm run build
